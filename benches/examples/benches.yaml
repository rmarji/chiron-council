# Chiron example councils ("benches"). They work before you set anything up.
# To keep and edit them, copy this file to ~/.chiron/benches.yaml (all projects)
# or .chiron/benches.yaml (this project only; wins on a name clash).
# Plain YAML. 2-8 advisors per council; more than 5 gets noisy.
#
# PROPOSED CHANGE: the author's personal seat (rayo) now sits only on `shipping`,
# where it is labelled as the author's own framework. The default money and
# deals councils use published thinkers only, so a stranger's first council
# never depends on someone else's private rules.

benches:
  # Money and bets: incentives, leverage, and how to price the offer
  money:
    seats: [munger, naval, hormozi]
    chairman: neutral
    default_depth: quick

  # Strategy calls: diagnosis before action, then leverage
  strategy:
    seats: [rumelt, munger, naval]
    chairman: neutral
    default_depth: full

  # Deals and negotiations: tactical empathy, incentives, persuasion
  deals:
    seats: [voss, munger, cialdini]
    chairman: neutral
    default_depth: quick

  # Relationship decisions: polarity lens + repair lens (authored opposition)
  relationship:
    seats: [deida, terry-real]
    chairman: neutral
    default_depth: full

  # Ship-or-slip: should you build it, and will you actually ship it.
  # Seats the author's own operating system (rayo) as an example of a personal seat.
  shipping:
    seats: [rayo, naval, rumelt]
    chairman: neutral
    default_depth: quick

  # Work and time design: Ferriss (minimize, automate) vs Hormozi (volume,
  # long hours) is authored opposition; Naval brings the leverage synthesis.
  work-design:
    seats: [tim-ferriss, hormozi, naval]
    chairman: neutral
    default_depth: full
