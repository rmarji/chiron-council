# Chiron bench examples — copy into ~/.claude/chiron/benches.yaml (global)
# or .chiron/benches.yaml (project; shadows global on name collision).
# Benches are plain YAML; edit by hand freely. 2-8 seats; >5 gets noisy.

benches:
  # Money and bets: incentives, leverage, and Rayo's (the author's) execution laws
  money:
    seats: [munger, naval, rayo]
    chairman: neutral
    default_depth: quick

  # Strategy calls: diagnosis before action, then leverage
  strategy:
    seats: [rumelt, munger, naval]
    chairman: neutral
    default_depth: full

  # Deals & negotiations
  deals:
    seats: [voss, munger, rayo]
    chairman: neutral
    default_depth: quick

  # Relationship decisions: polarity lens + repair lens (authored opposition)
  relationship:
    seats: [deida, terry-real]
    chairman: neutral
    default_depth: full

  # Ship-or-slip: should you build it, and will you actually ship it
  shipping:
    seats: [rayo, naval, rumelt]
    chairman: rayo
    default_depth: quick

  # Work & time design: how hard to work, and what to cut. Ferriss (minimize,
  # eliminate, automate a muse) vs Hormozi (volume, long hours) is authored
  # opposition; Naval brings the leverage synthesis. Neutral chairman.
  work-design:
    seats: [tim-ferriss, hormozi, naval]
    chairman: neutral
    default_depth: full
