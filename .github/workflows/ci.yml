name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lint every bundled seat (fails on warnings or errors)
        run: python3 scripts/lint_seat.py --all
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
